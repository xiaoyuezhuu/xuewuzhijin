name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_call:
  workflow_dispatch:

# The site is public and read-only; nothing here needs write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        run: npm run build
        env:
          # On GitHub Pages the site lives under /<repo>; override BASE_PATH
          # and SITE_URL as repo variables if you move to a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
