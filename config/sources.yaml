# Hacker News, via the free Algolia API. Stories are pulled per query and
# filtered by points, so this stays a high-signal channel rather than a firehose.
hn:
  enabled: true
  minPoints: 120
  queries:
    - AI alignment
    - AGI
    - interpretability
    - language model
    - neuroscience
    - synthetic biology
    - protein design
    - brain computer interface

# arXiv, via its free API — the other half of the ML-papers theme.
# `maxPerCategory` keeps any one category from flooding the candidate pool.
arxiv:
  enabled: true
  maxPerCategory: 12
  categories:
    - cs.AI
    - cs.LG
    - cs.CL    # computation and language — most LLM work lands here
    - cs.CY    # computers and society — AI policy and impact
    - stat.ML
    - q-bio.NC # neurons and cognition
    - q-bio.QM # quantitative methods / synthetic biology
  # Keyword filter over titles and abstracts. Empty = no filter.
  keywords:
    - alignment
    - interpretab
    - evaluation
    - benchmark
    - scaling
    - reasoning
    - agent
    - safety
    - emergent
    - reinforcement learning
    - protein
    - neural circuit

# Reddit. Needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET; skipped without them.
reddit:
  enabled: true
  minScore: 100
  subreddits:
    - MachineLearning
    - ControlProblem
    - singularity
    - neuro
    - synthbio
    - mlscaling

# YouTube, via per-channel Atom feeds (no API key needed). You need the
# channel ID, not the handle — run `npm run sources:youtube -- @handle` to
# resolve one. Placeholder: add your own.
youtube:
  enabled: true
  channels: []
  # - { name: Example Channel, channelId: "UCxxxxxxxxxxxxxxxxxxxxxx", topics: [AI] }

# X/Twitter. Needs X_BEARER_TOKEN with recent-search access (Basic tier+);
# skipped without it. Queries use X's search syntax.
x:
  enabled: true
  minLikes: 150
  maxResults: 50
  queries:
    - "(AI safety OR alignment OR interpretability) -is:retweet lang:en"
    - "(AGI OR \"frontier model\") -is:retweet lang:en"
    # Frontier figures with no blog and no Bluesky — X is the only place they
    # post. Verify each handle before enabling; a wrong one silently returns
    # nothing. minLikes still applies, so only widely-read posts surface.
    - "(from:geoffreyhinton OR from:ylecun OR from:demishassabis) -is:retweet"
